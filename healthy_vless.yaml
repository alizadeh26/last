port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: silent
proxies:
- name: 🇷🇺 俄罗斯 | RUS
  server: vps3.nemnogogo.com
  port: 443
  type: vless
  uuid: 38308ff1-5aa9-494f-a25a-0f2870d56b3e
  tls: true
  alpn:
  - h2
  servername: vps3.nemnogogo.com
  client-fingerprint: firefox
  network: grpc
  grpc-opts:
    grpc-mode: gun
    grpc-service-name: mobile.api.Event
  udp: true
- name: 🇩🇪 德国 | DEU 4
  server: harbor.gerqix.online
  port: 443
  type: vless
  uuid: 25ac78e7-6d1d-4c9a-a450-c01a4871769f
  tls: true
  alpn:
  - http/1.1
  servername: harbor.gerqix.online
  client-fingerprint: firefox
  network: ws
  ws-opts:
    path: /api/de1/stream
    headers:
      Host: harbor.gerqix.online
  udp: true
- name: 🇩🇪 德国 | DEU 16
  server: foliose.merlano.monster
  port: 443
  type: vless
  uuid: 25ac78e7-6d1d-4c9a-a450-c01a4871769f
  tls: true
  alpn:
  - http/1.1
  servername: foliose.merlano.monster
  client-fingerprint: firefox
  network: ws
  ws-opts:
    path: /api/de2/stream
    headers:
      Host: foliose.merlano.monster
  udp: true
proxy-groups:
- name: AUTO
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  proxies:
  - 🇷🇺 俄罗斯 | RUS
  - 🇩🇪 德国 | DEU 4
  - 🇩🇪 德国 | DEU 16
rules:
- MATCH,AUTO
