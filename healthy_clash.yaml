port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: silent
proxies:
- name: 🇩🇪 德国 | DEU
  server: ir2.cryptojakiro.com
  port: 443
  type: vless
  uuid: 8a1a991a-f206-447a-adaf-37a57c133418
  tls: true
  servername: ir2.cryptojakiro.com
  client-fingerprint: chrome
  network: ws
  ws-opts:
    path: /
    headers:
      Host: ir2.cryptojakiro.com
- name: 🇷🇺 俄罗斯 | RUS 7
  server: vps3.nemnogogo.com
  port: 443
  type: vless
  uuid: 38308ff1-5aa9-494f-a25a-0f2870d56b3e
  tls: true
  alpn:
  - h2
  servername: vps3.nemnogogo.com
  client-fingerprint: firefox
  network: grpc
  grpc-opts:
    grpc-mode: gun
    grpc-service-name: mobile.api.Event
  udp: true
proxy-groups:
- name: AUTO
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  proxies:
  - 🇩🇪 德国 | DEU
  - 🇷🇺 俄罗斯 | RUS 7
- name: PROTO-VLESS
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  proxies:
  - 🇩🇪 德国 | DEU
  - 🇷🇺 俄罗斯 | RUS 7
- name: REGION-AS
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  proxies:
  - 🇩🇪 德国 | DEU
- name: REGION-EU
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  proxies:
  - 🇷🇺 俄罗斯 | RUS 7
rules:
- MATCH,AUTO
